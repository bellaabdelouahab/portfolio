<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="utf-8" />
    <link rel="icon" href="/logo.jpg" />
    <!-- Base/shell CSS now lives in src/shared/styles/legacy-base.css so it is
         bundled and hashed. It replaced a 120 KB render-blocking public/fedora.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1c1c1c" />
    <meta name="author" content="Abdelouahab Bella" />
    <link rel="sitemap" type="application/xml" href="https://abdelouahab.xyz/sitemaps/sitemap.xml" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://api.ipify.org" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

    <!-- title/description/robots/canonical/OG/Twitter/JSON-LD are deliberately
         NOT declared here at all, static or otherwise. Every route renders
         SEO.jsx, which now genuinely SSRs these per request via server/index.mjs
         (see the marker comment right below this one) — declaring a static
         default here too doesn't get overridden by that injection (it's a
         plain string concat, not real DOM reconciliation the way client-side
         react-helmet worked): a static title tag here would sit BEFORE the
         injected one in the HTML source, and since a document's *first*
         title tag wins, every route's tab title/meta/JSON-LD would silently
         fall back to whatever static default lived here, no matter what
         SEO.jsx actually rendered. Found this exact bug shipping the service
         pages — this comment is why it must stay this way. -->
    <!--app-head-->
  </head>
  <body>
    <noscript>
      <strong>JavaScript is required to run the full app.</strong>
      <p>Abdelouahab Bella is a freelance web developer and data analyst based in Agadir, Morocco.</p>
      <p>Services: web development (business websites, web applications) and data analytics (Power BI dashboards, SQL and Python pipelines).</p>
      <p>Contact: https://abdelouahab.xyz</p>
    </noscript>

    <!-- Real per-request server-rendered markup goes here (see
         entry-server.jsx) — this replaces the old #static-seo-copy /
         puppeteer-prerender workaround entirely: crawlers now see full
         content in the initial response with no JS required. -->
    <div id="root" class="root"><!--app-html--></div>
    <!--hydration-data-->
    <!-- Privacy-friendly analytics (self-hosted Plausible), served from this site
         under neutral paths so blockers treat it as first-party. No cookies. -->
    <script>window.plausible=window.plausible||function(){(window.plausible.q=window.plausible.q||[]).push(arguments)}</script>
    <script defer data-domain="abdelouahab.xyz" data-api="/_s/e" src="/_s/a.js"></script>
  </body>
  <script type="module" src="/src/entry-client.jsx"></script>
  <script type="module" defer src="/script.js"></script>
</html>
