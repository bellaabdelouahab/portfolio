<!DOCTYPE html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="utf-8" />
    <link rel="icon" href="/logo.jpg" />
    <!-- Base/shell CSS now lives in src/shared/styles/legacy-base.css so it is
         bundled and hashed. It replaced a 120 KB render-blocking public/fedora.css. -->
    <title>Abdelouahab Bella | Data Analyst & Software Engineer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Portfolio of Abdelouahab Bella, a Data Analyst & Software Engineer with expertise in web development, machine learning and software development."
    />
    <meta name="author" content="Abdelouahab Bella" />
    <meta name="robots" content="index, follow" />
    <link rel="sitemap" type="application/xml" href="https://abdelouahab.xyz/sitemaps/sitemap.xml" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preload" href="/logo.jpg" as="image" />
    <link rel="preconnect" href="https://api.ipify.org" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />

    <!-- og:url and canonical are intentionally NOT set here. Every route renders
         components/common/SEO.jsx, which owns them via Helmet. Declaring them
         statically too produced two conflicting canonicals per page (both this
         "/" value and the route's own), which Google discards. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Abdelouahab Bella | Data Analyst & Software Engineer" />
    <meta property="og:description" content="Portfolio of Abdelouahab Bella, a Data Analyst & Software Engineer with expertise in web development, machine learning and software development." />
    <meta property="og:image" content="https://abdelouahab.xyz/logo.jpg" />
    <meta property="og:site_name" content="Abdelouahab Bella Portfolio" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Abdelouahab Bella | Data Analyst & Software Engineer" />
    <meta name="twitter:description" content="Portfolio of Abdelouahab Bella, a Data Analyst & Software Engineer with expertise in web development, machine learning and software development." />
    <meta name="twitter:image" content="https://abdelouahab.xyz/logo.jpg" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Abdelouahab Bella",
      "url": "https://abdelouahab.xyz",
      "image": "https://abdelouahab.xyz/logo.jpg",
      "jobTitle": "Data Analyst & Digital Adoption Consultant",
      "worksFor": { "@type": "Organization", "name": "eVia Services" },
      "alumniOf": { "@type": "CollegeOrUniversity", "name": "ENSA Khouribga" },
      "sameAs": [
        "https://www.linkedin.com/in/abdelouahab-bella",
        "https://github.com/bellaabdelouahab"
      ]
    }
    </script>

    <!-- Populated server-side per request by server/index.mjs with the
         title/meta/link/JSON-LD tags SEO.jsx produced via react-helmet for
         the matched route. Empty on this template as checked into git. -->
    <!--app-head-->
  </head>
  <body>
    <noscript>
      <strong>JavaScript is required to run the full app.</strong>
      <p>This website showcases the portfolio of Abdelouahab Bella, a Data Analyst & Software Engineer.</p>
      <p>Abdelouahab Bella is a Digital Adoption Consultant and Data Analyst based in Agadir, Morocco.</p>
      <p>Services include WalkMe implementation and digital adoption consulting, Power BI dashboards and data analytics, and full-stack web development.</p>
      <p>Contact: https://abdelouahab.xyz</p>
    </noscript>

    <!-- Real per-request server-rendered markup goes here (see
         entry-server.jsx) — this replaces the old #static-seo-copy /
         puppeteer-prerender workaround entirely: crawlers now see full
         content in the initial response with no JS required. -->
    <div id="root" class="root"><!--app-html--></div>
    <!--hydration-data-->
  </body>
  <script type="module" src="/src/entry-client.jsx"></script>
  <script type="module" defer src="/script.js"></script>
</html>
