name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 3 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Install Dependencies
        run: npm install

      # The build's prerender step drives a real Chrome. Explicit so the build
      # fails here, loudly, rather than mid-prerender if the postinstall was skipped.
      - name: Install Chrome for prerendering
        run: npx puppeteer browsers install chrome

      - name: Write Environment Variables to .env.production
        run: |
          cat <<EOF > .env.production
          VITE_SITE_URL=${{ vars.SITE_URL || 'https://abdelouahab.xyz' }}
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          EOF

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        run: | 
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_B64" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_B64" | base64 -d > /tmp/serviceAccountKey.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/serviceAccountKey.json" >> $GITHUB_ENV
          fi

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Build
        run: npm run build
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@4.1.5
        with:
          branch: gh-pages
          folder: build
